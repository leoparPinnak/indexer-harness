<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
	<style>
		:root {
			--indexer-favicon-ink: #111;
			--indexer-favicon-plate: #fff;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--indexer-favicon-ink: #fff;
				--indexer-favicon-plate: #111;
			}
		}
	</style>
	<rect width="50" height="50" rx="11" fill="var(--indexer-favicon-plate)"/>
	<rect x="0.75" y="0.75" width="48.5" height="48.5" rx="10.25" stroke="var(--indexer-favicon-ink)" stroke-opacity="0.22" stroke-width="1.5"/>
	<text x="25" y="25" text-anchor="middle" dominant-baseline="central" fill="var(--indexer-favicon-ink)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5">IH</text>
</svg>
